# Parser v12 new-types test (owner, 2026-11-17): expected programs for the phase-4.7 intents.
# Separate from the no-regression gate (eval/parser_eval.py). Scored by eval/parser_newtypes.py.
# Groups (`source`):
# - train: train working-set questions (outside dev and validation, their images and the v12
#   few-shots), picked by wording; this file keeps their ids and programs only (no text).
# - owner_written: only lines the owner marks "owner | <type> | <question>" in owner_questions.txt,
#   text verbatim. None are in the file yet.
# - ai_drafted_owner_reviewed: the first 50 questions of owner_questions.txt (text verbatim, `line` = its
#   line), AI-drafted and reviewed by the owner. The owner's correction (2026-11-17): the earlier
#   "owner-written" label was wrong.
# - assistant_written: 50 questions this assistant wrote in the dataset's style, because the train
#   working set has too few of these types (count 2, applies_to 2, place rules 2, lights / markings /
#   duties / meanings 0). Not dataset text.
# `gap: true` marks a question the DSL cannot express (expected program out of scope); gaps are reported
# apart from the type rates. `also_accept` lists other programs that are equally right.
# Decision (owner, 2026-11-17): only train (>= 5 per type) and owner_written (>= 3 per type) decide which
#   types stay on, each at >= 80% exact programs; a weaker type is listed, and its rules stay on only if
#   the owner agrees. ai_drafted_owner_reviewed and assistant_written are smoke tests only (same model
#   family as the parser), reported apart.
