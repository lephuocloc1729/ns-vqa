image:                    # the tile is cut from the original and enlarged up to these limits
  prep_version: tile1
  long_edge: 1568
  max_pixels: 1150000
  jpeg_quality: 90
  grid: 2
  overlap: 0.2
effort:
  claude-haiku-5-5: medium
  claude-sonnet-5-5: medium
  claude-opus-5-5: medium
user_text: "This is one tile of a larger photo. Read the road signs in it and reply with the JSON object."
pictograms: pictograms.yaml
