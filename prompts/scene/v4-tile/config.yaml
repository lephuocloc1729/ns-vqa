# Scene prompt v4-tile: the fallback's region pass (docs/plans/phase-3.md, item 7;
# owner, 2026-11-16). The v4 spec plus a note that the image is one tile. Part of the
# prompt hash. Not pinned by sha256 until set-T development picks the combining rule.
