name: RAG GPU image

# Builds services/rag/docker/Dockerfile.gpu and pushes it to the GitHub container registry:
#   ghcr.io/<owner>/ns-vqa-rag:latest and :<commit sha>
# The build runs in GitHub's datacenter, so nothing is uploaded from a developer machine.
# On a pull request it builds without pushing, so a broken Dockerfile shows before the merge.
on:
  pull_request:
    paths:
      - "services/rag/**"
      - ".github/workflows/rag-image.yml"
  push:
    branches: [main]
    paths:
      - "services/rag/**"
      - ".github/workflows/rag-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: rag-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The CUDA PyTorch base is several GB; the runner's default free space is tight.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ns-vqa-rag" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: services/rag
          file: services/rag/docker/Dockerfile.gpu
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
