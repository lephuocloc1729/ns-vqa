name: CD

# After CI passes on main: build the `api` and `web` images, push them to the GitHub container
# registry, and deploy them to the demo server over SSH. The server checks the stack and rolls back
# to the previous images if the check fails (docker/deploy.sh). Each run shows as a "production"
# deployment on the repository's Deployments page.
#
# Secrets (repository settings, Actions):
#   DEPLOY_HOST         the server's address
#   DEPLOY_SSH_KEY      a private key whose public half is in the server's authorized_keys
#   DEPLOY_KNOWN_HOSTS  the server's host key line(s), from `ssh-keyscan <host>`
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-production
  cancel-in-progress: false   # never stop a deploy halfway

env:
  APP_DIR: /opt/signcite

jobs:
  build:
    # a manual run, or a CI run on a push to main that passed
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      api: ${{ steps.meta.outputs.api }}
      web: ${{ steps.meta.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Image names
        id: meta
        run: |
          sha=$(git rev-parse HEAD)
          owner=${GITHUB_REPOSITORY_OWNER,,}
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "api=ghcr.io/$owner/signcite-api:$sha" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/$owner/signcite-web:$sha" >> "$GITHUB_OUTPUT"
          echo "latest_api=ghcr.io/$owner/signcite-api:latest" >> "$GITHUB_OUTPUT"
          echo "latest_web=ghcr.io/$owner/signcite-web:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.api }}
            ${{ steps.meta.outputs.latest_api }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.web }}
            ${{ steps.meta.outputs.latest_web }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://signcite.xyz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
      - name: SSH key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          printf 'Host server\n  HostName %s\n  User root\n  IdentityFile ~/.ssh/deploy\n  StrictHostKeyChecking yes\n' \
            "${{ secrets.DEPLOY_HOST }}" > ~/.ssh/config
      - name: Send this commit's files (compose files, configs, the deploy script)
        # unpacked by deploy.sh, which can restore the previous files on a rollback;
        # .env and the pictogram copies on the server are not in git, so they stay as they are
        run: git archive --format=tar HEAD | ssh server "cat > $APP_DIR/.incoming.tar"
      - name: Registry login on the server (this run's short-lived token)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | ssh server docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Deploy, check, roll back files and images on failure
        # the commit's own deploy script, taken from its files
        run: |
          ssh server "tar -xOf $APP_DIR/.incoming.tar docker/deploy.sh > /tmp/signcite-deploy.sh && \
            APP_DIR=$APP_DIR bash /tmp/signcite-deploy.sh '${{ needs.build.outputs.api }}' '${{ needs.build.outputs.web }}' $APP_DIR/.incoming.tar; \
            rc=\$?; rm -f $APP_DIR/.incoming.tar /tmp/signcite-deploy.sh; exit \$rc"
      - name: Registry logout on the server
        if: always()
        run: ssh server docker logout ghcr.io || true
      - name: The public site answers
        run: |
          for i in 1 2 3 4 5; do curl -fsS --max-time 15 https://signcite.xyz/healthz && exit 0; sleep 5; done
          exit 1
