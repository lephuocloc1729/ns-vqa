name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, KB load, leakage guard, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # A clean checkout has no dataset and no pictogram copies; the tests that
      # need them (tests/needs_local_data.txt) are skipped with a reason.
      VQA_NO_LOCAL_DATA: "1"
      VQA_DATASET_DIR: /nonexistent
    steps:
      - uses: actions/checkout@v4
        with:
          # The freeze tests hash vqa/ and kb/ at older commits (git archive).
          fetch-depth: 0

      - name: Install SWI-Prolog (>= 9.1)
        run: |
          sudo apt-add-repository -y ppa:swi-prolog/stable
          sudo apt-get update -q
          sudo apt-get install -y -q swi-prolog-nox
          swipl --version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the package
        run: |
          python -m pip install -U pip
          pip install -e '.[dev,api]' ruff

      - name: Lint (ruff)
        run: ruff check vqa app eval tests tools

      - name: Load the Prolog knowledge base
        run: swipl -q -g "consult('kb/load.pl'), halt" -t "halt(1)"

      - name: Leakage guard
        run: python -m pytest -q tests/test_leakage_guard.py

      - name: Test suite
        run: python -m pytest -q -rs --junitxml=reports/junit.xml

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: reports/junit.xml

  rag-service:
    name: RAG service tests (no GPU, no index)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the RAG package (CPU only)
        run: pip install -e '.[service,dev]'
      - name: Compile the RAG code
        run: python -m compileall -q src experiments scripts
      - name: Runner help and asset manifest
        run: |
          python -m text_based_rag.natural_qa_runner --help > /dev/null
          python -c "import json; m = json.load(open('assets_manifest.json')); assert m['files'] and m['downloads']"
      - name: Service tests (tests needing the gitignored index are skipped)
        run: python -m pytest -q -rs tests

  web:
    name: Web UI (typecheck, unit tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (SSE parser, turn reducer)
        run: npx vitest run
      - name: Build
        run: npx vite build

  web-e2e:
    name: Web UI end to end (real API, fake pipeline, no Claude calls)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VQA_NO_LOCAL_DATA: "1"
      VQA_DATASET_DIR: /nonexistent
    steps:
      - uses: actions/checkout@v4
      - name: Install SWI-Prolog (the API imports the pipeline)
        run: |
          sudo apt-add-repository -y ppa:swi-prolog/stable
          sudo apt-get update -q
          sudo apt-get install -y -q swi-prolog-nox
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the API
        run: |
          python -m pip install -U pip
          pip install -e '.[api]'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the web UI and Chromium
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright (desktop and phone)
        working-directory: web
        env:
          PYTHON: python
        run: npx playwright test
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results

  compose:
    name: Docker Compose stack (fake pipeline, no Claude calls)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build the images
        run: docker compose build
      - name: Start the stack (a clean machine, no .env)
        run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test through nginx
        run: |
          set -e
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/health | tee /dev/stderr | grep -q '"database":true'
          curl -fsS http://localhost:8080/version | grep -q fake-e2e
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/metrics)" = 404
          # one streamed answer, end to end: nginx -> api (fake pipeline) -> postgres
          curl -fsSN -F image=@web/e2e/fixtures/road.jpg --form-string "question=Xe ô tô có được đi vào không?" \
            http://localhost:8080/v1/ask/stream > stream.txt
          grep -q '^event: token_reset' stream.txt
          grep -q '^event: answer' stream.txt
          grep -q '^event: done' stream.txt
      - name: Monitoring is up and scraping the API
        run: |
          set -e
          curl -fsS http://localhost:3000/api/health
          for i in $(seq 1 30); do
            curl -fsS 'http://localhost:9090/api/v1/query?query=sum(vqa_answers_total)' | grep -q '"value"' && break
            sleep 2
          done
          curl -fsS 'http://localhost:9090/api/v1/query?query=sum(vqa_answers_total)' | tee /dev/stderr | grep -q '"1"'
          curl -fsS -u admin:admin 'http://localhost:3000/api/dashboards/uid/mat-luat' | grep -q 'Mắt Luật'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop
        if: always()
        run: docker compose down -v
