global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api                 # answers by route, latency per stage, Claude cost, feedback
    metrics_path: /metrics
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: node                # the server's CPU, RAM, disk, network
    static_configs: [{ targets: ["node-exporter:9100"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  # The RAG's GPU (on the GPU box): add its DCGM exporter here when it runs, e.g.
  # - job_name: gpu
  #   static_configs: [{ targets: ["host.docker.internal:9400"] }]
