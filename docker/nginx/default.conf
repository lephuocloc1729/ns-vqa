# SignCite: the UI's static files, and the API behind the same origin (so the stream needs no CORS).
upstream api { server api:8000; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 12m;            # the API refuses images above 10 MB with a clear message

    # optional login for the whole site (BASIC_AUTH_USER / BASIC_AUTH_PASSWORD, tester accounts; the admin
    # console can turn it off); it also sets $site_user, the login passed to the API
    include /etc/nginx/auth.conf;

    location = /healthz { auth_basic off; access_log off; return 200 "ok\n"; }

    # the answer stream: no buffering, long reads (a cold answer takes 15-30 s; the API sends keep-alives)
    location = /v1/ask/stream {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Remote-User $site_user;     # the site login that asked (never the browser's)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    # the admin API exists only on the admin site (port 81 below)
    location ^~ /v1/admin { return 404; }
    location ~ ^/(v1/|health$|version$|docs|openapi\.json) {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Remote-User $site_user;
        proxy_read_timeout 300s;
    }
    # metrics stay inside the stack (Prometheus scrapes the API directly)
    location = /metrics { return 404; }

    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}

# The admin site: admin.<domain> through Caddy, or ADMIN_PORT (127.0.0.1:8081) on the server itself.
# Its own login (admin_auth.conf); the API checks the same login again on every /v1/admin request.
server {
    listen 81;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/admin_auth.conf;
    client_max_body_size 12m;            # demo photos are uploaded here (Ảnh mẫu); the API's own limit is 10 MB

    location = /healthz { auth_basic off; access_log off; return 200 "ok\n"; }
    location ~ ^/(v1/|version$) {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Remote-User "";
        proxy_read_timeout 60s;
    }
    location = /v1/ask/stream { return 404; }        # asking happens on the public site
    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri /admin.html; add_header Cache-Control "no-cache"; }
}
