# SignCite: the UI's static files, and the API behind the same origin (so the stream needs no CORS).
upstream api { server api:8000; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 12m;            # the API refuses images above 10 MB with a clear message

    # optional shared password for the whole site (BASIC_AUTH_USER / BASIC_AUTH_PASSWORD)
    include /etc/nginx/auth.conf;

    location = /healthz { auth_basic off; access_log off; return 200 "ok\n"; }

    # the answer stream: no buffering, long reads (a cold answer takes 15-30 s; the API sends keep-alives)
    location = /v1/ask/stream {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location ~ ^/(v1/|health$|version$|docs|openapi\.json) {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    # metrics stay inside the stack (Prometheus scrapes the API directly)
    location = /metrics { return 404; }

    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
