[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-vqa"
version = "0.1.0"
description = "Neuro-symbolic traffic sign VQA (VLSP2025-MLQA-Natural)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "janus-swi>=1.5",
    "anthropic>=2.8,<3",
    "Pillow>=10",          # vqa/perception/image.py
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
eval = ["Pillow>=10", "numpy>=1.26"]
api = [                    # app/api, the backend
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20",
    "psycopg[binary]>=3.2",
]

[tool.setuptools.packages.find]
include = ["vqa*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
# CI lints for real errors only: syntax errors, undefined names, invalid
# comparisons. Style rules are not enforced, so the frozen phase52 code is not
# reformatted.
select = ["E9", "F63", "F7", "F82"]
