[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-vqa"
version = "0.1.0"
description = "Neuro-symbolic traffic sign VQA (VLSP2025-MLQA-Natural)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "janus-swi>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["vqa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
