# Guide-board transcription labels for the B6 perception test (phase 4.5 step 1; owner, 2026-11-17).
#
# Dev images only (data/splits/train_dev.json; readable). The 24 dev images that carry an
# information (I) or expressway (IE) board, or whose dev question asks about one. Transcribed
# by the assistant from the images, against the board itself (not the dataset answer):
# checked_by: assistant. The owner's spot-check is welcome before the scores are used.
#
# Per board:
#   entries   one per destination / route line: text (as printed, diacritics kept), distance
#             (as printed, with unit) and direction (the arrow it sits with: straight, left,
#             right, slight_left, slight_right, none when there is no arrow)
#   speeds    speed discs printed on or mounted with the board: {kind: max|min, value}
#   route     route code plate (CT.01 ...)
#   other     other printed lines worth reading (headings, EXPRESSWAY, phone numbers ...)
#
# Notes where the dataset answer disagrees with the board (kept as printed):
#   train_4_6: QL 1A is 2 KM to the right; train_230's answer says "Rẽ trái, còn 5 km".
#   train_4_17: the "40" disc is blue (minimum speed); train_248's answer says "Tối đa 40 km/h".

