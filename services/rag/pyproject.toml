[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "Traffic-sign-VQA"
version = "0.1.0"
description = "Multimodal retrieval-augmented generation for Vietnamese legal question answering"
requires-python = ">=3.10,<3.13"

[tool.setuptools.packages.find]
where = ["src"]
