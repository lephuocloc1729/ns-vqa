[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "Traffic-sign-VQA"
version = "0.1.0"
description = "Multimodal retrieval-augmented generation for Vietnamese legal question answering"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy", "requests", "pillow"]

[project.optional-dependencies]
service = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]   # the HTTP service (service_api.py)
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
text_based_rag = ["caption_settings.json"]
