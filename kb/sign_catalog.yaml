    name_en: No U-turn for cars
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      prohibits: [{actions: [u_turn], vehicles: [{class: car}, {class: sidecar}]}]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.24"}

  - code: P.124c
    name_vi: Cấm rẽ trái và quay đầu xe
    name_en: No left turn and no U-turn
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      prohibits: [{actions: [turn_left, u_turn], vehicles: [{class: vehicle}]}]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.24"}

  - code: P.124d
    name_vi: Cấm rẽ phải và quay đầu xe
    name_en: No right turn and no U-turn
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      prohibits: [{actions: [turn_right, u_turn], vehicles: [{class: vehicle}]}]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.24"}

  - code: P.125
    name_vi: Cấm vượt
    name_en: No overtaking
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      # Overtaking two-wheel motorbikes and mopeds stays allowed (B.25 b); the
      # overtaken vehicle is not modelled yet, see tests/test_prohibitions.py.
      prohibits: [{actions: [overtake], vehicles: [{class: motor_vehicle}]}]
      priority_exempt: false   # "kể cả xe được ưu tiên theo quy định"
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.25"}

  - code: P.126
    name_vi: Cấm xe ô tô tải vượt
    name_en: No overtaking by trucks
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      prohibits:
        - actions: [overtake]
          vehicles: [{class: truck, conditions: [{attr: load_t, op: gt, value: 3.5}]}]
      priority_exempt: false
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.26"}

  - code: P.128
    name_vi: Cấm sử dụng còi
    name_en: No horn
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      prohibits: [{actions: [honk], vehicles: [{class: vehicle}]}]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.28"}

  - code: P.130
    name_vi: Cấm dừng xe và đỗ xe
    name_en: No stopping or parking
    category: prohibitory
    visual: {shape: circle, border: red, background: blue}
    effect:
      prohibits: [{actions: [stop, park], vehicles: [{class: motor_vehicle}]}]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.30"}

  - code: P.131a
    name_vi: Cấm đỗ xe
    name_en: No parking
    category: prohibitory
    visual: {shape: circle, border: red, background: blue}
    effect:
      prohibits: [{actions: [park], vehicles: [{class: motor_vehicle}]}]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.31"}

  - code: P.131b
    name_vi: Cấm đỗ xe ngày lẻ
    name_en: No parking on odd days
    category: prohibitory
    visual: {shape: circle, border: red, background: blue}
    effect:
      prohibits: [{actions: [park], vehicles: [{class: motor_vehicle}]}]
      days: odd
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.31"}

  - code: P.131c
    name_vi: Cấm đỗ xe ngày chẵn
    name_en: No parking on even days
    category: prohibitory
    visual: {shape: circle, border: red, background: blue}
    effect:
      prohibits: [{actions: [park], vehicles: [{class: motor_vehicle}]}]
      days: even
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.31"}

  - code: P.136
    name_vi: Cấm đi thẳng
    name_en: No straight ahead
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      prohibits: [{actions: [go_straight], vehicles: [{class: vehicle}]}]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.36"}

  - code: P.137
    name_vi: Cấm rẽ trái, rẽ phải
