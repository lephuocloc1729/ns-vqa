  - code: P.117
    name_vi: Hạn chế chiều cao
    name_en: Height limit
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      prohibits: [{actions: [enter], vehicles: [{class: vehicle}]}]
      priority_exempt: false
      value: {attr: height_m, op: gt, unit: m, applies_to: [vehicle]}
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.17"}

  - code: P.123a
    name_vi: Cấm rẽ trái
    name_en: No left turn
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      # "Biển không có giá trị cấm quay đầu xe"
