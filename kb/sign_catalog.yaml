    name_vi: Cấm quay đầu xe
    name_en: No U-turn
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      # "Biển không có giá trị cấm rẽ trái để đi sang hướng đường khác"
      prohibits: [{actions: [u_turn], vehicles: [{class: vehicle}]}]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.24"}

  - code: P.124b
    key: no_u_turn_for_cars
    tags: [turn_ban, u_turn_ban]
    name_vi: Cấm ô tô quay đầu xe
    name_en: No U-turn for cars
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      prohibits: [{actions: [u_turn], vehicles: [{class: car}, {class: sidecar}]}]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.24"}

  - code: P.124c
    key: no_left_turn_and_no_u_turn
    tags: [turn_ban, u_turn_ban]
    name_vi: Cấm rẽ trái và quay đầu xe
    name_en: No left turn and no U-turn
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      prohibits: [{actions: [turn_left, u_turn], vehicles: [{class: vehicle}]}]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.24"}

  - code: P.124d
    key: no_right_turn_and_no_u_turn
    tags: [turn_ban, u_turn_ban]
    name_vi: Cấm rẽ phải và quay đầu xe
