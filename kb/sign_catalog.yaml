    name_vi: Cấm rẽ trái
    name_en: No left turn
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      # "Biển không có giá trị cấm quay đầu xe"
      prohibits: [{actions: [turn_left], vehicles: [{class: vehicle}]}]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.23"}

  - code: P.123b
    key: no_right_turn
    tags: [turn_ban]
    name_vi: Cấm rẽ phải
    name_en: No right turn
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      prohibits: [{actions: [turn_right], vehicles: [{class: vehicle}]}]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.23"}

  - code: P.124a
    key: no_u_turn
