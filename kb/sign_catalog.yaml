    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.24"}

  - code: P.125
    key: no_overtaking
    tags: [overtaking_ban]
    name_vi: Cấm vượt
    name_en: No overtaking
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      # Overtaking two-wheel motorbikes and mopeds stays allowed (B.25 b); the
      # overtaken vehicle is not modelled yet, see tests/test_prohibitions.py.
      prohibits: [{actions: [overtake], vehicles: [{class: motor_vehicle}]}]
      priority_exempt: false   # "kể cả xe được ưu tiên theo quy định"
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.25"}

  - code: P.126
    key: no_overtaking_by_trucks
    tags: [overtaking_ban]
    name_vi: Cấm xe ô tô tải vượt
    name_en: No overtaking by trucks
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      prohibits:
        - actions: [overtake]
          vehicles: [{class: truck, conditions: [{attr: load_t, op: gt, value: 3.5}]}]
      priority_exempt: false
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.26"}

