    name_vi: Hướng đi phải theo (chỉ được rẽ phải)
    name_en: Turn right only (before the intersection)
    category: mandatory
    visual: {shape: circle, border: none, background: blue}
    effect: {only_directions: [turn_right]}
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.1a"}

  - code: R.301e
    name_vi: Hướng đi phải theo (chỉ được rẽ trái)
    name_en: Turn left only (before the intersection)
    category: mandatory
    visual: {shape: circle, border: none, background: blue}
    effect: {only_directions: [turn_left]}
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.1a"}

  - code: R.301f
    name_vi: Hướng đi phải theo (chỉ được đi thẳng và rẽ phải)
    name_en: Straight ahead or right only
    category: mandatory
    visual: {shape: circle, border: none, background: blue}
    effect: {only_directions: [go_straight, turn_right]}
