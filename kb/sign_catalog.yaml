    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      prohibits: [{actions: [turn_left, turn_right], vehicles: [{class: vehicle}]}]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.37"}

  - code: P.138
    name_vi: Cấm đi thẳng, rẽ trái
    name_en: No straight ahead or left turn
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      prohibits: [{actions: [go_straight, turn_left], vehicles: [{class: vehicle}]}]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.38"}

  - code: P.139
    name_vi: Cấm đi thẳng, rẽ phải
    name_en: No straight ahead or right turn
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      prohibits: [{actions: [go_straight, turn_right], vehicles: [{class: vehicle}]}]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.39"}

  # ------------------------------------------------------------------ speed
  - code: P.127
    name_vi: Tốc độ tối đa cho phép
    name_en: Maximum speed limit
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      max_speed: [motor_vehicle]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.27"}

  - code: P.127a
    name_vi: Tốc độ tối đa cho phép về ban đêm
    name_en: Maximum speed limit at night
    category: prohibitory
    visual: {shape: rectangle, border: none, background: blue}
    effect:
      # in force only during the time written on the sign: perception emits it as a time plate
      max_speed: [motor_vehicle]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.27a"}

  - code: P.127b
    name_vi: Biển ghép tốc độ tối đa cho phép trên từng làn đường
    name_en: Maximum speed per lane
    category: prohibitory
    visual: {shape: rectangle, border: none, background: blue}
    effect:
      lane_board: true
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.27b"}

  - code: P.127c
    name_vi: Biển ghép tốc độ tối đa cho phép theo phương tiện, trên từng làn đường
    name_en: Maximum speed per lane and vehicle type
    category: prohibitory
    visual: {shape: rectangle, border: none, background: blue}
    effect:
      # "Các loại phương tiện phải đi đúng làn đường và tuân thủ tốc độ tối đa"
      lane_board: true
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.27c"}

  - code: R.306
    name_vi: Tốc độ tối thiểu cho phép
    name_en: Minimum speed
    category: mandatory
    visual: {shape: circle, border: none, background: blue}
    effect:
      min_speed: [motor_vehicle]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.6"}

  # ------------------------------------------------------------------ end of restriction
  - code: DP.127
    name_vi: Biển hết tốc độ tối đa cho phép theo biển ghép
    name_en: End of per-lane speed limits
    category: end_of_restriction
    visual: {shape: rectangle, border: none, background: blue}
    effect:
      ends: [P.127b, P.127c]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.27d"}

  - code: DP.133
    name_vi: Hết cấm vượt
    name_en: End of no overtaking
    category: end_of_restriction
    visual: {shape: circle, border: black, background: white}
    effect:
      ends: [P.125, P.126]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.33"}

  - code: DP.134
    name_vi: Hết tốc độ tối đa cho phép
    name_en: End of maximum speed limit
    category: end_of_restriction
    visual: {shape: circle, border: black, background: white}
    effect:
      ends: [P.127]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.34"}

  - code: DP.135
    name_vi: Hết tất cả các lệnh cấm
    name_en: End of all restrictions
    category: end_of_restriction
    visual: {shape: circle, border: black, background: white}
    effect:
      ends: [P.121, P.125, P.126, P.127, P.128, P.130, P.131a, P.131b, P.131c]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.35"}

  # ------------------------------------------------------------------ mandatory directions
  - code: R.301a
