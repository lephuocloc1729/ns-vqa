  - code: P.111d
    name_vi: Cấm xe ba bánh loại không có động cơ
    name_en: No non-motorised tricycles
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      prohibits: [{actions: [enter], vehicles: [{class: cyclo}]}]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.11"}

  - code: P.112
