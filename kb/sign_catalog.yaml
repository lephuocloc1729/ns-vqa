  - code: R.412e
    key: city_bus_lane
    tags: [reserved_lane]
    name_vi: Làn đường dành cho xe buýt
    name_en: City bus lane
    category: mandatory
    visual: {shape: rectangle, border: none, background: blue}
    # Dashed-line bus lanes may be entered by others while yielding (D.14 a);
    # lane markings are out of scope in v1, so the solid-line reading is used.
    effect: {lane_reserved: [city_bus]}
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.14"}

  - code: R.412f
    key: car_lane
    tags: [reserved_lane]
    name_vi: Làn đường dành cho xe ô tô
    name_en: Car lane
    category: mandatory
    visual: {shape: rectangle, border: none, background: blue}
    effect: {lane_reserved: [car]}
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.14"}

  - code: R.412g
    key: motorbike_and_bicycle_lane
    tags: [reserved_lane]
    name_vi: Làn đường dành cho xe máy và xe đạp
    name_en: Motorbike and bicycle lane
    category: mandatory
    visual: {shape: rectangle, border: none, background: blue}
    effect: {lane_reserved: [motorbike, rudimentary]}
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.14"}

  - code: R.412h
    key: bicycle_lane
    tags: [reserved_lane]
    name_vi: Làn đường dành cho xe đạp
    name_en: Bicycle lane
    category: mandatory
    visual: {shape: rectangle, border: none, background: blue}
    effect: {lane_reserved: [rudimentary]}
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.14"}

  - code: R.415a
    key: lanes_by_vehicle
    tags: [lane_board]
    name_vi: Biển gộp làn đường theo phương tiện
    name_en: Lanes by vehicle type
    category: mandatory
    visual: {shape: rectangle, border: none, background: blue}
    effect:
      # D.16 a: shows the vehicles allowed on each lane (SceneGraph Sign.lanes, no speeds).
      # "Biển không áp dụng với các xe chuyển làn để ra vào hoặc dừng, đỗ bên đường."
      lane_board: true
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.16"}

  - code: R.415b
    key: end_of_lanes_by_vehicle
    tags: [end_of_restriction]
    name_vi: Kết thúc làn đường theo phương tiện
    name_en: End of lanes by vehicle type
    category: end_of_restriction
    visual: {shape: rectangle, border: none, background: blue}
    effect:
      ends: [R.415a]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.16"}

