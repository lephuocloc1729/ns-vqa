  - code: R.301g
    name_vi: Hướng đi phải theo (chỉ được đi thẳng và rẽ trái)
    name_en: Straight ahead or left only
    category: mandatory
    visual: {shape: circle, border: none, background: blue}
    effect: {only_directions: [go_straight, turn_left]}
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.1a"}

  - code: R.301h
    name_vi: Hướng đi phải theo (chỉ được rẽ trái và rẽ phải)
    name_en: Left or right only
    category: mandatory
    visual: {shape: circle, border: none, background: blue}
    effect: {only_directions: [turn_left, turn_right]}
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.1a"}

  # ------------------------------------------------------------------ reserved lanes
  - code: R.412a
    name_vi: Làn đường dành cho xe ô tô khách
    name_en: Bus and coach lane
    category: mandatory
    visual: {shape: rectangle, border: none, background: blue}
    effect: {lane_reserved: [bus]}      # "kể cả ô tô buýt": city_bus is a bus
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.14"}

  - code: R.412b
    name_vi: Làn đường dành cho xe ô tô con
    name_en: Passenger car lane
    category: mandatory
    visual: {shape: rectangle, border: none, background: blue}
    effect: {lane_reserved: [passenger_car]}
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.14"}

  - code: R.412c
    name_vi: Làn đường dành cho xe ô tô tải
    name_en: Truck lane
    category: mandatory
    visual: {shape: rectangle, border: none, background: blue}
    effect:
      lane_reserved: [truck]
      # an optional "<3,5t" on the symbol limits the lane to trucks under that load
      value: {attr: load_t, op: lt, unit: t, applies_to: [truck]}
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.14"}

  - code: R.412d
    name_vi: Làn đường dành cho xe máy
    name_en: Motorbike lane
    category: mandatory
    visual: {shape: rectangle, border: none, background: blue}
    effect: {lane_reserved: [motorbike]}
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.14"}

  - code: R.412e
    name_vi: Làn đường dành cho xe buýt
    name_en: City bus lane
    category: mandatory
    visual: {shape: rectangle, border: none, background: blue}
    # Dashed-line bus lanes may be entered by others while yielding (D.14 a);
    # lane markings are out of scope in v1, so the solid-line reading is used.
    effect: {lane_reserved: [city_bus]}
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.14"}

  - code: R.412f
    name_vi: Làn đường dành cho xe ô tô
    name_en: Car lane
    category: mandatory
    visual: {shape: rectangle, border: none, background: blue}
    effect: {lane_reserved: [car]}
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.14"}

  - code: R.412g
    name_vi: Làn đường dành cho xe máy và xe đạp
    name_en: Motorbike and bicycle lane
    category: mandatory
    visual: {shape: rectangle, border: none, background: blue}
    effect: {lane_reserved: [motorbike, rudimentary]}
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.14"}

  - code: R.412h
    name_vi: Làn đường dành cho xe đạp
    name_en: Bicycle lane
    category: mandatory
    visual: {shape: rectangle, border: none, background: blue}
    effect: {lane_reserved: [rudimentary]}
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.14"}

