  - code: R.301c
    name_vi: Hướng đi phải theo (chỉ được rẽ trái)
    name_en: Turn left only (after the intersection)
    category: mandatory
    visual: {shape: circle, border: none, background: blue}
    effect: {only_directions: [turn_left]}
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.1a"}

