  - code: DP.135
    key: end_of_all_restrictions
    tags: [end_of_restriction]
    name_vi: Hết tất cả các lệnh cấm
    name_en: End of all restrictions
    category: end_of_restriction
    visual: {shape: circle, border: black, background: white}
    effect:
      ends: [P.121, P.125, P.126, P.127, P.128, P.130, P.131a, P.131b, P.131c]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.35"}

  # D.7 b): "hiệu lực của biển số R.306 hết tác dụng, kể từ biển này các xe được phép
  # chạy chậm hơn trị số ghi trên biển nhưng không được gây cản trở các xe khác"
  - code: R.307
    key: end_of_minimum_speed
    tags: [end_of_restriction]
    name_vi: Hết tốc độ tối thiểu
    name_en: End of minimum speed
    category: end_of_restriction
    visual: {shape: circle, border: none, background: blue}
    effect:
      ends: [R.306]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.7"}

  # D.12 a): "Đến hết đoạn đường dành cho ô tô đi lại, đặt biển số R404a"
  - code: R.404a
    key: end_of_car_road
    tags: [end_of_restriction]
    name_vi: Hết đoạn đường dành cho xe ô tô
    name_en: End of road for cars
    category: end_of_restriction
    visual: {shape: rectangle, border: white, background: blue}
    effect:
      ends: [R.403a]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.12"}

  # ------------------------------------------------------------------ mandatory directions
  - code: R.301a
    key: straight_ahead_only
    tags: [direction_order]
    name_vi: Hướng đi phải theo (chỉ được đi thẳng)
    name_en: Straight ahead only
    category: mandatory
    visual: {shape: circle, border: none, background: blue}
    effect:
      only_directions: [go_straight]
      # D.1a c: before the intersection it applies at the intersection behind the sign
      # (no left/right turn); after it, from the sign to the next intersection, with
      # "cấm rẽ trái và quay đầu" (turning into gates and alleys stays allowed).
      placement:
        standard: either
        before_intersection: {directions: [go_straight], scope: intersection_behind}
        after_intersection: {directions: [go_straight], scope: until_next_intersection}
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.1a"}

  - code: R.301b
    key: turn_right_only_after_intersection
    tags: [direction_order]
    name_vi: Hướng đi phải theo (chỉ được rẽ phải)
    name_en: Turn right only (after the intersection)
    category: mandatory
    visual: {shape: circle, border: none, background: blue}
    effect:
      only_directions: [turn_right]
      # D.1a: "R.301(b,c) được đặt ở sau nơi đường giao nhau ... chỉ được phép rẽ phải
      # hoặc rẽ trái ở phạm vi nơi đường giao nhau trước mặt biển"
      placement:
        standard: after_intersection
        after_intersection: {directions: [turn_right], scope: intersection_ahead}
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.1a"}

  - code: R.301c
    key: turn_left_only_after_intersection
    tags: [direction_order]
    name_vi: Hướng đi phải theo (chỉ được rẽ trái)
    name_en: Turn left only (after the intersection)
    category: mandatory
    visual: {shape: circle, border: none, background: blue}
    effect:
      only_directions: [turn_left]
      placement:
        standard: after_intersection
        after_intersection: {directions: [turn_left], scope: intersection_ahead}
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.1a"}

  - code: R.301d
    key: turn_right_only_before_intersection
    tags: [direction_order]
    name_vi: Hướng đi phải theo (chỉ được rẽ phải)
    name_en: Turn right only (before the intersection)
    category: mandatory
    visual: {shape: circle, border: none, background: blue}
    effect:
      only_directions: [turn_right]
      # D.1a: "R.301(d,e) được đặt ở trước nơi đường giao nhau ... ở phạm vi nơi đường
      # giao nhau đằng sau mặt biển"
      placement:
        standard: before_intersection
        before_intersection: {directions: [turn_right], scope: intersection_behind}
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.1a"}

  - code: R.301e
    key: turn_left_only_before_intersection
    tags: [direction_order]
    name_vi: Hướng đi phải theo (chỉ được rẽ trái)
    name_en: Turn left only (before the intersection)
    category: mandatory
    visual: {shape: circle, border: none, background: blue}
    effect:
      only_directions: [turn_left]
      placement:
        standard: before_intersection
        before_intersection: {directions: [turn_left], scope: intersection_behind}
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.1a"}

  - code: R.301f
    key: straight_ahead_or_right_only
    tags: [direction_order]
    name_vi: Hướng đi phải theo (chỉ được đi thẳng và rẽ phải)
    name_en: Straight ahead or right only
    category: mandatory
    visual: {shape: circle, border: none, background: blue}
    effect:
      only_directions: [go_straight, turn_right]
      placement:
        standard: before_intersection
        before_intersection: {directions: [go_straight, turn_right], scope: intersection_behind}
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.1a"}

  - code: R.301g
    key: straight_ahead_or_left_only
    tags: [direction_order]
    name_vi: Hướng đi phải theo (chỉ được đi thẳng và rẽ trái)
    name_en: Straight ahead or left only
    category: mandatory
    visual: {shape: circle, border: none, background: blue}
    effect:
      only_directions: [go_straight, turn_left]
      # D.1a: "chỉ được phép đi thẳng hay rẽ trái và được phép quay đầu xe"
      placement:
        standard: before_intersection
        before_intersection: {directions: [go_straight, turn_left, u_turn], scope: intersection_behind}
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.1a"}

  - code: R.301h
    key: left_or_right_only
    tags: [direction_order]
    name_vi: Hướng đi phải theo (chỉ được rẽ trái và rẽ phải)
    name_en: Left or right only
    category: mandatory
    visual: {shape: circle, border: none, background: blue}
    effect:
      only_directions: [turn_left, turn_right]
      # D.1a: "chỉ được phép rẽ trái, quay đầu hoặc rẽ phải ở phạm vi nơi đường giao nhau
      # trước mặt biển"
      placement:
        standard: after_intersection
        after_intersection: {directions: [turn_left, u_turn, turn_right], scope: intersection_ahead}
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.1a"}

  # Mandatory signs whose effect the rules don't model yet (effect_unmodelled): known by
  # code and meaning; closed-world claims treat them like unreadable signs of their kind.

  # D.2 c): "Biển có hiệu lực bắt buộc các loại xe phải đi vòng chướng ngại vật theo
  # hướng mũi tên chỉ." Also used with P.102 on a median for one-way carriageways.
  - code: R.302(a,b,c)
    key: pass_obstacle_this_side
    name_vi: Hướng phải đi vòng chướng ngại vật
    name_en: Pass the obstacle on the side shown
    category: mandatory
    visual: {shape: circle, border: none, background: blue}
    variants: [a, b, c]
    effect_unmodelled: true
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.2"}

  # D.3 b): "Biển có hiệu lực bắt buộc các loại xe muốn chuyển hướng phải chạy vòng
  # theo đảo an toàn theo hướng mũi tên."
  - code: R.303
    key: roundabout
    name_vi: Nơi giao nhau chạy theo vòng xuyến
    name_en: Roundabout
    category: mandatory
    visual: {shape: circle, border: none, background: blue}
    effect_unmodelled: true
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.3"}

  # D.13: "Biển có tác dụng bắt buộc người tham gia giao thông phải đi đúng làn đường
  # đã được chỉ dẫn hướng phù hợp với hành trình của xe." Lane rows don't carry
  # directions yet.
  - code: R.411
    key: lane_directions
    name_vi: Hướng đi trên mỗi làn đường phải theo
    name_en: Directions per lane
    category: mandatory
    visual: {shape: rectangle, border: white, background: blue}
    effect_unmodelled: true
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.13"}

  # D.17 b): "phạm vi phải tuân theo những quy định đi đường được áp dụng ở khu đông
  # dân cư" (e.g. built-up-area speed limits, which are not modelled).
  - code: R.420
    key: built_up_area_start
    name_vi: Bắt đầu khu đông dân cư
    name_en: Start of built-up area
    category: mandatory
    visual: {shape: rectangle, border: white, background: blue}
    effect_unmodelled: true
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.17"}

  # ------------------------------------------------------------------ reserved lanes
  - code: R.412a
    key: bus_and_coach_lane
    tags: [reserved_lane]
    name_vi: Làn đường dành cho xe ô tô khách
    name_en: Bus and coach lane
    category: mandatory
    visual: {shape: rectangle, border: none, background: blue}
    effect: {lane_reserved: [bus]}      # "kể cả ô tô buýt": city_bus is a bus
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.14"}

  - code: R.412b
    key: passenger_car_lane
    tags: [reserved_lane]
    name_vi: Làn đường dành cho xe ô tô con
    name_en: Passenger car lane
    category: mandatory
    visual: {shape: rectangle, border: none, background: blue}
    effect: {lane_reserved: [passenger_car]}
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.14"}

  - code: R.412c
    key: truck_lane
    tags: [reserved_lane]
    name_vi: Làn đường dành cho xe ô tô tải
    name_en: Truck lane
    category: mandatory
    visual: {shape: rectangle, border: none, background: blue}
    effect:
      lane_reserved: [truck]
      # an optional "<3,5t" on the symbol limits the lane to trucks under that load
      value: {attr: load_t, op: lt, unit: t, applies_to: [truck]}
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.14"}

  - code: R.412d
    key: motorbike_lane
    tags: [reserved_lane]
    name_vi: Làn đường dành cho xe máy
