# Starter sign catalog, phase 1 (DESIGN.md "Knowledge base and rule engine", layer 1).
#
# Every row is drafted from the QCVN 41:2024/BGTVT appendix article named in
# `source` and has to be checked by a person before you rely on it
# (`reviewed_by: none` until it is; `human` or `assistant` says who checked it).
#
# Fields
#   code, name_vi, name_en, category    identity (category: prohibitory | mandatory | warning
#                                       | information | auxiliary | end_of_restriction)
#   key                                 unique snake_case meaning, used by Selector.meaning
#   tags                                broader meanings a Selector may also use (speed_limit, ...)
#   visual                              shape / border / background for the perception prompt
#   effect                              what the rule engine uses (all keys optional):
#     prohibits: [{actions, vehicles: [VehicleSpec]}]   forbidden actions per vehicle spec
#     except: [class]                   classes the sign never applies to
#     priority_exempt: bool             true = priority vehicles on duty are exempt (default true)
#     value: {attr, op, applies_to}     the number read on the sign becomes a condition
#                                       `attr op value` on the listed vehicle classes
#     days: even | odd                  sign is in force only on even / odd days of the month
#     max_speed: [class]                sign value is a max speed (km/h) for these classes
#     min_speed: [class]                sign value is a min speed (km/h) for these classes
#     lane_board: true                  values come per lane from SceneGraph Sign.lanes
#     lane_reserved: [class]            lane (Sign.position.lane) reserved for these classes
#     only_directions: [action]         only these of go_straight/turn_left/turn_right allowed
#     ends: [code]                      end-of-restriction: cancels these signs
#     placement: {standard, before_intersection, after_intersection}
#                                       R.301 family (D.1a): directions allowed and their scope
#                                       for each placement the article describes; scope is
#                                       intersection_behind | intersection_ahead | until_next_intersection
#   effect_unmodelled: true             the sign has a legal effect the rules don't model yet
#                                       (no effect keys). Questions about its identity and
#                                       meaning work; closed-world claims treat it like an
#                                       unreadable sign of its visible kind (CLAUDE.md).
#   source                              law_id + article_id, same format as relevant_articles
#
# VehicleSpec is {class, conditions: [{attr, op, value}]} as in vqa/schemas.py.

version: "qcvn41-2024.phase1"
law_versions:
  - "QCVN 41:2024/BGTVT"
  - "36/2024/QH15"

# Vehicle classes that are our reading of the law, not a class the law names.
# They are cited in every proof that uses them, marked as an interpretation.
vehicle_interpretations:
  - class: similar_rudimentary
    label_vi: "xe 4 bánh thô sơ (và xe thô sơ tương tự khác)"
    note: >-
      Interpretation: Law 36/2024/QH15 art. 34(2) lists bicycles, pedal-assist bicycles,
      cyclos, wheelchairs and animal-drawn carts, and "(e) xe tương tự" (similar vehicles).
      It names no four-wheeled class, so "xe 4 bánh thô sơ" is read as 34(2)(e).
    source: {law_id: "36/2024/QH15", article_id: "34"}

signs:
  # ------------------------------------------------------------------ prohibitory
  - code: P.101
    key: road_closed
    tags: [vehicle_ban]
    name_vi: Đường cấm
    name_en: Road closed
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      prohibits: [{actions: [enter], vehicles: [{class: vehicle}]}]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.1"}

  - code: P.102
    key: no_entry_one_way
    name_vi: Cấm đi ngược chiều
    name_en: No entry
    category: prohibitory
    visual: {shape: circle, border: red, background: red}
    effect:
      prohibits: [{actions: [enter], vehicles: [{class: vehicle}]}]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.2"}

  - code: P.103a
    key: no_cars
    tags: [vehicle_ban]
    name_vi: Cấm xe ô tô
    name_en: No cars
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      # "các loại xe cơ giới kể cả xe máy 3 bánh có thùng ... trừ xe máy 2 bánh, xe gắn máy"
      prohibits: [{actions: [enter], vehicles: [{class: motor_vehicle}]}]
      except: [motorcycle, moped]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.3"}

  - code: P.103b
    key: no_right_turn_for_cars
    tags: [turn_ban]
    name_vi: Cấm xe ô tô rẽ phải
    name_en: No right turn for cars
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      prohibits: [{actions: [turn_right], vehicles: [{class: motor_vehicle}]}]
      except: [motorcycle, moped]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.3"}

  - code: P.103c
    key: no_left_turn_for_cars
    tags: [turn_ban]
    name_vi: Cấm xe ô tô rẽ trái
    name_en: No left turn for cars
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      prohibits: [{actions: [turn_left], vehicles: [{class: motor_vehicle}]}]
      except: [motorcycle, moped]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.3"}

  - code: P.104
    key: no_motorbikes
    tags: [vehicle_ban]
    name_vi: Cấm xe máy
    name_en: No motorbikes
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      # "Biển không có giá trị cấm những người dắt xe máy" (walking it is not riding it)
      prohibits: [{actions: [enter], vehicles: [{class: motorbike}]}]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.4"}

  - code: P.105
    key: no_cars_and_motorbikes
    tags: [vehicle_ban]
    name_vi: Cấm xe ô tô và xe máy
    name_en: No cars and motorbikes
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      prohibits: [{actions: [enter], vehicles: [{class: motor_vehicle}]}]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.5"}

  - code: P.106a
    key: no_trucks
    tags: [vehicle_ban]
    name_vi: Cấm xe ô tô tải
    name_en: No trucks
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      prohibits:
        - {actions: [enter], vehicles: [{class: truck}, {class: tractor}, {class: special_machine}]}
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.6"}

  - code: P.106b
    key: no_trucks_over_load
    tags: [vehicle_ban, weight_limit]
    name_vi: Cấm xe ô tô tải có khối lượng chuyên chở lớn hơn giá trị ghi trên biển
    name_en: No trucks above the load shown
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      prohibits:
        - {actions: [enter], vehicles: [{class: truck}, {class: tractor}, {class: special_machine}]}
      value: {attr: load_t, op: gt, unit: t, applies_to: [truck]}
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.6"}

  - code: P.107
    key: no_buses_and_trucks
    tags: [vehicle_ban]
    name_vi: Cấm xe ô tô khách và xe ô tô tải
    name_en: No buses and trucks
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      prohibits:
        - actions: [enter]
          vehicles: [{class: bus}, {class: truck}, {class: tractor}, {class: special_machine}]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.7"}

  - code: P.107a
    key: no_buses_coaches
    tags: [vehicle_ban]
    name_vi: Cấm xe ô tô khách
    name_en: No buses (coaches)
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      prohibits: [{actions: [enter], vehicles: [{class: bus}]}]
      except: [city_bus]   # "Biển này không cấm xe buýt"
      # seat count written on the symbol or on a plate (B.7a b)
      value: {attr: seats, op: gt, unit: seats, applies_to: [bus]}
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.7a"}

  - code: P.107b
    key: no_taxis
    tags: [vehicle_ban]
    name_vi: Cấm xe ô tô taxi
    name_en: No taxis
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      prohibits: [{actions: [enter], vehicles: [{class: taxi}]}]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.7b"}

  - code: P.109
    key: no_tractors
    tags: [vehicle_ban]
    name_vi: Cấm máy kéo
    name_en: No tractors
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      prohibits: [{actions: [enter], vehicles: [{class: tractor}]}]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.9"}

  - code: P.110a
    key: no_bicycles
    tags: [vehicle_ban]
    name_vi: Cấm xe đạp
    name_en: No bicycles
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      prohibits: [{actions: [enter], vehicles: [{class: bicycle}]}]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.10"}

  - code: P.110b
    key: no_cargo_bicycles
    tags: [vehicle_ban]
    name_vi: Cấm xe đạp thồ
    name_en: No cargo bicycles
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      prohibits: [{actions: [enter], vehicles: [{class: cargo_bicycle}]}]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.10"}

  - code: P.111a
    key: no_mopeds
    tags: [vehicle_ban]
    name_vi: Cấm xe gắn máy
    name_en: No mopeds
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      prohibits: [{actions: [enter], vehicles: [{class: moped}]}]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.11"}

  - code: P.111b
    key: no_motor_tricycles
    tags: [vehicle_ban]
    name_vi: Cấm xe ba bánh loại có động cơ
    name_en: No motor tricycles
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      prohibits: [{actions: [enter], vehicles: [{class: motor_tricycle}]}]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.11"}

  - code: P.111d
    key: no_non_motorised_tricycles
    tags: [vehicle_ban]
    name_vi: Cấm xe ba bánh loại không có động cơ
    name_en: No non-motorised tricycles
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      prohibits: [{actions: [enter], vehicles: [{class: cyclo}]}]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.11"}

  - code: P.112
    key: no_pedestrians
    tags: [vehicle_ban]
    name_vi: Cấm người đi bộ
    name_en: No pedestrians
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      prohibits: [{actions: [enter], vehicles: [{class: pedestrian}]}]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.12"}

  - code: P.115
    key: gross_weight_limit
    tags: [weight_limit]
    name_vi: Hạn chế trọng tải toàn bộ xe
    name_en: Gross weight limit
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      prohibits: [{actions: [enter], vehicles: [{class: vehicle}]}]
      priority_exempt: false   # "kể cả các xe được ưu tiên theo quy định"
      value: {attr: gross_t, op: gt, unit: t, applies_to: [vehicle]}
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.15"}

  - code: P.117
    key: height_limit
    name_vi: Hạn chế chiều cao
    name_en: Height limit
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      prohibits: [{actions: [enter], vehicles: [{class: vehicle}]}]
      priority_exempt: false
      value: {attr: height_m, op: gt, unit: m, applies_to: [vehicle]}
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.17"}

  # B.18 b): "có hiệu lực cấm các xe (cơ giới và thô sơ) kể cả các xe được ưu tiên
  # theo quy định có chiều ngang (kể cả xe và hàng hóa) vượt quá trị số ghi trên biển"
  - code: P.118
    key: width_limit
    name_vi: Hạn chế chiều ngang xe
    name_en: Width limit
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      prohibits: [{actions: [enter], vehicles: [{class: vehicle}]}]
      priority_exempt: false   # "kể cả các xe được ưu tiên theo quy định"
      value: {attr: width_m, op: gt, unit: m, applies_to: [vehicle]}
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.18"}

  # B.19 a): "Để báo đường cấm các loại xe (cơ giới và thô sơ) kể cả các xe được ưu tiên
  # theo quy định, có độ dài toàn bộ kể cả xe và hàng lớn hơn trị số ghi trên biển đi qua"
  # B.19 b): the value is the longest length allowed "đối với xe đơn chiếc" (for a
  # single vehicle); combinations are not modelled separately.
  - code: P.119
    key: length_limit
    name_vi: Hạn chế chiều dài xe
    name_en: Length limit
    category: prohibitory
    visual: {shape: circle, border: red, background: white}
    effect:
      prohibits: [{actions: [enter], vehicles: [{class: vehicle}]}]
      priority_exempt: false   # "kể cả các xe được ưu tiên theo quy định"
      value: {attr: length_m, op: gt, unit: m, applies_to: [vehicle]}
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.19"}

