      max_speed: [motor_vehicle]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.27a"}

  - code: P.127b
    key: max_speed_per_lane
    tags: [speed_limit]
    name_vi: Biển ghép tốc độ tối đa cho phép trên từng làn đường
    name_en: Maximum speed per lane
    category: prohibitory
    visual: {shape: rectangle, border: none, background: blue}
    effect:
      lane_board: true
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.27b"}

  - code: P.127c
    key: max_speed_per_lane_and_vehicle
    tags: [speed_limit]
    name_vi: Biển ghép tốc độ tối đa cho phép theo phương tiện, trên từng làn đường
    name_en: Maximum speed per lane and vehicle type
    category: prohibitory
    visual: {shape: rectangle, border: none, background: blue}
    effect:
      # "Các loại phương tiện phải đi đúng làn đường và tuân thủ tốc độ tối đa"
      lane_board: true
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.27c"}

  - code: R.306
    key: min_speed
    tags: [speed_limit]
    name_vi: Tốc độ tối thiểu cho phép
    name_en: Minimum speed
    category: mandatory
    visual: {shape: circle, border: none, background: blue}
    effect:
      min_speed: [motor_vehicle]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.6"}

  # D.11 l): "Ngoài các loại phương tiện quy định trên biển được đi lại, các loại phương
  # tiện giao thông khác không được phép đi vào đoạn đường có đặt các biển số R.403a,
  # R 403b, ..." law_db has no article D.11: its text is merged into the end of D.10,
  # so the rows cite D.10. Only the variants seen in the gold (a, b) are added.
  - code: R.403a
    key: car_road
    tags: [vehicle_ban]
    name_vi: Đường dành cho xe ô tô
    name_en: Road for cars
    category: mandatory
    visual: {shape: rectangle, border: white, background: blue}
    effect:
      # a): "Để báo hiệu bắt đầu đường dành cho các loại ô tô đi lại"
      prohibits: [{actions: [enter], vehicles: [{class: vehicle}]}]
      except: [car]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.10"}

  - code: R.403b
    key: car_and_motorbike_road
    tags: [vehicle_ban]
    name_vi: Đường dành cho xe ô tô, xe máy
    name_en: Road for cars and motorbikes
    category: mandatory
    visual: {shape: rectangle, border: white, background: blue}
    effect:
      # b): "Để báo hiệu bắt đầu đường dành cho các loại ô tô, xe máy đi lại"
      prohibits: [{actions: [enter], vehicles: [{class: vehicle}]}]
      except: [car, motorbike]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "D.10"}

  # ------------------------------------------------------------------ end of restriction
  - code: DP.127
    key: end_of_per_lane_speed_limits
    tags: [end_of_restriction]
    name_vi: Biển hết tốc độ tối đa cho phép theo biển ghép
    name_en: End of per-lane speed limits
    category: end_of_restriction
    visual: {shape: rectangle, border: none, background: blue}
    effect:
      ends: [P.127b, P.127c]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.27d"}

  - code: DP.133
    key: end_of_no_overtaking
    tags: [end_of_restriction]
    name_vi: Hết cấm vượt
    name_en: End of no overtaking
    category: end_of_restriction
    visual: {shape: circle, border: black, background: white}
    effect:
      ends: [P.125, P.126]
    source: {law_id: "QCVN 41:2024/BGTVT", article_id: "B.33"}

  - code: DP.134
    key: end_of_maximum_speed_limit
    tags: [end_of_restriction]
    name_vi: Hết tốc độ tối đa cho phép
    name_en: End of maximum speed limit
    category: end_of_restriction
    visual: {shape: circle, border: black, background: white}
