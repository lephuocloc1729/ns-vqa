# Effects for rows of kb/sign_catalog_meaning.yaml (phase 4.5 stage A; owner, 2026-11-17).
#
# The meaning file is generated by tools/draft_catalog_rows.py and would overwrite hand edits,
# so effects for its rows live here. vqa.kb.load_catalog merges each entry into the row with
# the same code: the effect keys are added, and the row is no longer meaning-only.
#
# Every entry cites the row's own article (the row's `source`) plus the article named in its
# comment. Rules that are our reading rather than law text are marked in kb/rules/zones.pl
# with law_id `interpretation` (KB-3, KB-4). Effects are drafts until a person checks them:
# effect_reviewed_by: assistant.

effects:
  # ------------------------------------------------------------------ F4 zones: expressway
  # QCVN 41 P.3 (IE.452 "Chỉ dẫn bắt đầu đường cao tốc"); Law 36/2024 art. 25 sets the rules
  # on it. KB-4: the road being entered is an expressway from the sign on.
  - code: IE.452
    effect: {zone: {kind: expressway, at: start}}
    effect_reviewed_by: assistant
  - code: IE.451b
    effect: {zone: {kind: expressway, at: start}}
    effect_reviewed_by: assistant
    note: "KB-4: an expressway entrance sign; the road it leads onto is an expressway"
  - code: IE.453b
    effect: {zone: {kind: expressway, at: end}}
    effect_reviewed_by: assistant
  - code: IE.453c
    effect: {zone: {kind: expressway, at: end}}
    effect_reviewed_by: assistant

  # ------------------------------------------------------------------ F5 conduct: warnings
  # QCVN 41 art. 27: "Khi gặp biển báo nguy hiểm và cảnh báo, người tham gia giao thông phải
  # giảm tốc độ đến mức cần thiết, chú ý quan sát và chuẩn bị sẵn sàng xử lý những tình huống
  # có thể xẩy ra để phòng ngừa tai nạn." Plus each sign's own wording where it adds to it.
  - code: W.245a        # C.45: "nhắc lái xe giảm tốc độ đi chậm"
    effect: {conduct: [reduce_speed, drive_slowly, observe, be_ready]}
    effect_reviewed_by: assistant
  - code: W.227         # C.27: "tốc độ xe chạy phải giảm cho thích hợp, không gây nguy hiểm cho người và máy móc"
    effect: {conduct: [reduce_speed, observe, be_ready, mind_workers_and_machines]}
    effect_reviewed_by: assistant
  - code: W.203(a,b,c)
    effect: {conduct: [reduce_speed, observe, be_ready]}
    effect_reviewed_by: assistant
  - code: W.224         # C.24: "các xe phải giảm tốc độ, nhường ưu tiên cho người đi bộ"
    effect: {conduct: [reduce_speed, yield_to_pedestrians, observe, be_ready]}
    effect_reviewed_by: assistant
  - code: W.233
    effect: {conduct: [reduce_speed, observe, be_ready]}
    effect_reviewed_by: assistant
  - code: W.207(a,b,c,d,e,f,g,h,i,k,l)
    effect: {conduct: [reduce_speed, observe, be_ready]}
    effect_reviewed_by: assistant
  - code: W.239a
    effect: {conduct: [reduce_speed, observe, be_ready, mind_overhead_clearance]}
    effect_reviewed_by: assistant
  - code: W.205(a,b,c,d,e)
    effect: {conduct: [reduce_speed, observe, be_ready]}
    effect_reviewed_by: assistant
  - code: W.209
    effect: {conduct: [reduce_speed, observe, be_ready, obey_traffic_lights]}
    effect_reviewed_by: assistant
  - code: W.246(a,b,c)
    effect: {conduct: [reduce_speed, observe, be_ready]}
    effect_reviewed_by: assistant
  - code: W.201b
    effect: {conduct: [reduce_speed, observe, be_ready]}
    effect_reviewed_by: assistant
  - code: W.210
    effect: {conduct: [reduce_speed, observe, be_ready]}
    effect_reviewed_by: assistant

  # ------------------------------------------------------------------ F5 conduct: information signs
  - code: I.423(a,b)    # E.23a b): "phải điều khiển xe chạy chậm, chú ý quan sát, ưu tiên cho người đi bộ sang ngang"
    effect: {conduct: [drive_slowly, observe, yield_to_pedestrians]}
    effect_reviewed_by: assistant
  - code: IE.471        # Law 36/2024 art. 12.1: "khoảng cách an toàn tối thiểu với xe phía trước"
    effect: {conduct: [keep_safe_distance]}
    effect_reviewed_by: assistant

  # ------------------------------------------------------------------ F6 information that permits or orders
  - code: I.409         # E.9 a): "Để chỉ dẫn vị trí được phép quay đầu xe"
    effect: {permits: [u_turn]}
    effect_reviewed_by: assistant
  - code: I.408         # E.8 a): "Để chỉ dẫn những nơi được phép đỗ xe"
    effect: {permits: [park]}
    effect_reviewed_by: assistant
  # E.7 b): "chỉ cho phép các loại phương tiện giao thông đi theo chiều vào theo mũi tên chỉ,
  # cấm quay đầu ngược lại (trừ các xe được quyền ưu tiên theo quy định)"
  - code: I.407(a,b,c)
    effect:
      prohibits: [{actions: [u_turn], vehicles: [{class: vehicle}]}]
      conduct: [follow_the_arrow_direction]
    effect_reviewed_by: assistant
  # E.1: vehicles on this road go first; side roads "phải dừng lại nhường cho phương tiện trên
  # đường chính đi trước"
  - code: I.401
    effect: {conduct: [priority_over_side_roads]}
    effect_reviewed_by: assistant

  # ------------------------------------------------------------------ F7 guide, no restriction (KB-3)
  # QCVN 41 art. 11: the guide group "chỉ dẫn hoặc thông báo"; these rows order nothing, so
  # closed-world claims ignore them (their content is stage B, rank 9).
  - {code: "I.414(a,b,c,d)", effect: {informational: true}, effect_reviewed_by: assistant}
  - {code: "I.444(a,b,c,d,e,f,g,h,i,j,k,l,m)", effect: {informational: true}, effect_reviewed_by: assistant}
  - {code: I.415, effect: {informational: true}, effect_reviewed_by: assistant}
  - {code: IE.465, effect: {informational: true}, effect_reviewed_by: assistant}
  - {code: IE.466, effect: {informational: true}, effect_reviewed_by: assistant}
  - {code: IE.454, effect: {informational: true}, effect_reviewed_by: assistant}
  - {code: IE.464, effect: {informational: true}, effect_reviewed_by: assistant}
  - {code: I.449, effect: {informational: true}, effect_reviewed_by: assistant}
  - {code: I.419a, effect: {informational: true}, effect_reviewed_by: assistant}
  - {code: IE.460, effect: {informational: true}, effect_reviewed_by: assistant}
  - {code: IE.464b, effect: {informational: true}, effect_reviewed_by: assistant}
  - {code: IE.467, effect: {informational: true}, effect_reviewed_by: assistant}
  - {code: IE.474, effect: {informational: true}, effect_reviewed_by: assistant}
  - {code: "I.417(a,b,c)", effect: {informational: true}, effect_reviewed_by: assistant}
  # KB-8, law-cited (its clause is in law_db): Law 36/2024 art. 18.4 i) "không được dừng xe,
  # đỗ xe tại các vị trí sau đây: ... i) Điểm đón, trả khách". E.36: I.434a marks "chỗ dừng
  # đỗ xe buýt cho khách lên xuống". The rule (kb/rules/zones.pl, r_pickup_point) bans
  # stopping and parking there for every vehicle except the buses it serves (city_bus).
  - code: I.434a
    effect: {conduct: [pickup_point]}
    effect_reviewed_by: assistant
