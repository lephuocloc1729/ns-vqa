  center/solid: {text: "vạch 1.2: phân chia hai chiều xe chạy; xe không được lấn làn, không được đè lên vạch", article: "G.1"}
  # 1.3 "xe không được lấn làn, không được đè lên vạch"
  center/double_solid: {text: "vạch 1.3: phân chia hai chiều xe chạy; xe không được lấn làn, không được đè lên vạch", article: "G.1"}
  # 1.4 "Xe trên làn đường tiếp giáp với vạch đứt nét được phép cắt qua ...; Xe trên làn đường tiếp giáp với vạch liền nét không được lấn làn"
  center/solid_dashed: {text: "vạch 1.4: xe bên vạch đứt được cắt qua khi cần thiết; xe bên vạch liền không được lấn làn, đè vạch", article: "G.1"}
  center/dashed_solid: {text: "vạch 1.4: xe bên vạch đứt được cắt qua khi cần thiết; xe bên vạch liền không được lấn làn, đè vạch", article: "G.1"}
  # 2.1 "dùng để phân chia các làn xe cùng chiều ... xe được phép thực hiện việc chuyển làn đường qua vạch 2.1"
  lane_line/dashed: {text: "vạch 2.1: phân chia các làn xe cùng chiều; xe được phép chuyển làn qua vạch", article: "G.1"}
  # 2.2 "dùng để phân chia các làn xe cùng chiều trong trường hợp không cho phép xe chuyển làn"
  lane_line/solid: {text: "vạch 2.2: phân chia các làn xe cùng chiều; không cho phép chuyển làn, không được lấn làn, đè vạch", article: "G.1"}
  # 2.4 "xe trên làn đường tiếp giáp với vạch đứt nét được phép cắt qua khi cần thiết"
  lane_line/solid_dashed: {text: "vạch 2.4: xe bên vạch đứt được cắt qua khi cần thiết; xe bên vạch liền không được lấn làn, đè vạch", article: "G.1"}
  # 3.1 "xe chạy được phép đè lên vạch khi cần thiết và phải nhường đường cho xe thô sơ"
  edge/solid: {text: "vạch 3.1: giới hạn mép phần đường xe chạy; được đè lên vạch khi cần thiết và phải nhường đường cho xe thô sơ", article: "G.1"}
  # 4.1 "các phương tiện giao thông phải đi theo tuyến đường quy định, không được lấn vạch hoặc cắt qua vạch"
  hatched: {text: "vạch kênh hóa 4.1: không được lấn vạch hoặc cắt qua vạch", article: "G.1"}
  # G.2 7.1 "xác định vị trí người điều khiển phương tiện phải dừng lại khi có tín hiệu đèn đỏ hoặc khi có biển số R.122"
  stop_line: {text: "vạch dừng 7.1: vị trí phải dừng lại khi có tín hiệu đèn đỏ hoặc biển R.122", article: "G.2"}

# art. 51: "Vạch kẻ đường khi sử dụng độc lập thì người tham gia giao thông phải tuân theo ý nghĩa của vạch
# kẻ đường. Vạch kẻ đường khi sử dụng kết hợp với đèn tín hiệu, biển báo hiệu thì ... phải tuân theo ý nghĩa,
# hiệu lệnh của cả vạch kẻ đường và đèn tín hiệu, biển báo hiệu theo thứ tự quy định tại Điều 4"
marking_effect: {text: "vạch dùng độc lập thì tuân theo ý nghĩa của vạch; dùng cùng đèn tín hiệu, biển báo thì tuân theo cả vạch, đèn và biển theo thứ tự ưu tiên tại Điều 4", article: "51"}

# What each kind of line separates, for marking_is claims ("vạch liền có dùng để phân chia các làn
# xe cùng chiều không?"): G.1 1.x center lines separate the two directions; 2.x lane lines
# separate lanes of one direction.
separates:
  center: opposite_directions
  lane_line: same_direction_lanes
