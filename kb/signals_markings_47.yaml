# Phase 4.7 step 1d (owner, 2026-11-17: additive only): what a traffic light or a road marking in the
# photo means, for `signal_meaning` / `marking_meaning`. Each line restates the cited text, quoted in
# the comment. reviewed_by: assistant.

reviewed_by: assistant

signals:
  # QCVN 41 art. 6.3.1 "Tín hiệu xanh: tín hiệu đèn màu xanh là được đi"
  green: {text: "được đi; nếu có người đi bộ, xe lăn đang qua đường thì phải giảm tốc độ hoặc dừng lại nhường đường", article: "6"}
  # 6.3.2 "Tín hiệu đèn màu vàng phải dừng lại trước vạch dừng; trường hợp đang đi trên vạch dừng hoặc đã đi qua vạch dừng ... thì được đi tiếp"
  yellow: {text: "phải dừng lại trước vạch dừng; nếu đã đi trên hoặc qua vạch dừng thì được đi tiếp", article: "6"}
  # 6.3.2 "Trường hợp tín hiệu đèn màu vàng nhấp nháy ... được đi nhưng phải quan sát, giảm tốc độ hoặc dừng lại nhường đường"
  yellow_flashing: {text: "được đi nhưng phải quan sát, giảm tốc độ hoặc dừng lại nhường đường", article: "6"}
  # 6.3.3 "Tín hiệu đèn màu đỏ là cấm đi: báo hiệu phải dừng lại trước vạch dừng"
  red: {text: "cấm đi; phải dừng lại trước vạch dừng (không có vạch dừng thì dừng trước đèn)", article: "6"}
  # 6.4.1 "chỉ được đi khi tín hiệu mũi tên bật sáng cho phép. Tín hiệu mũi tên cho phép rẽ trái thì đồng thời cho phép quay đầu"
  green_arrow: {text: "được đi theo hướng mũi tên (mũi tên rẽ trái đồng thời cho phép quay đầu nếu không có báo hiệu cấm quay đầu)", article: "6"}
  # 6.4.4 "Khi tín hiệu mũi tên màu đỏ ... thì phương tiện không được đi theo hướng mũi tên"
  red_arrow: {text: "không được đi theo hướng mũi tên", article: "6"}

markings:
